    - who co-occurs with [hydrocodone](ingredient_name) most often?
    - show top [10](top_k) neighbors for [ibuprofen](ingredient_name)
    - list [25](top_k) similar to [lisinopril](ingredient_name)
    - show combo overlap neighbors
    - similar by co-formulation
    - show similar ingredients to this one


