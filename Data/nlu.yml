- regex: top_k
  examples: |
    # "top 10", "top 5", etc.
    - (?<=\btop\s)\d{1,3}\b
    # "show 10 products", "list 15 brands", "display 25 results", etc.
    - \b\d{1,3}\b(?=\s+(?:products?|results?|items?|brands?|neighbors?|substitutes?|equivalents?|strengths?)\b)
- regex: number
  examples: |
    - \d+(\.\d+)?
- regex: percent
  examples: |
    - \d+(\.\d+)?\s?%
- regex: strength
  examples: |
    - (?i)\b\d+(\.\d+)?\s?(mg|mcg|g|%)\b
- regex: combo_strength
  examples: |
    - (?i)\b\d+(\.\d+)?\s?(mg|mcg|g)\s?\/\s?\d+(\.\d+)?\s?(mg|mcg|g)\b


- synonym: acetaminophen
  examples: |
    - APAP
    - paracetamol

- synonym: hydroCHLOROthiazide
  examples: |
    - HCTZ
    - hydrochlorothiazide

- synonym: ibuprofen
  examples: |
    - advil
    - motrin
